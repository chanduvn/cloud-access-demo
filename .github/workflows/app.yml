name: 'Day 2 - Application'

# ---------------------------------------------------------------
# This pipeline deploys the Flask application code to the Azure
# Web App that was already provisioned by the Day 0 infra pipeline.
# It runs automatically when application source files change,
# or can be triggered manually.
# ---------------------------------------------------------------

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - '.github/workflows/app.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - '.github/workflows/app.yml'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  # ---------------------------------------------------------------
  # JOB 1: Validate — runs on Pull Requests to check the app
  # ---------------------------------------------------------------
  validate:
    name: 'Validate Application'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: pip install -r src/requirements.txt

    - name: Syntax check
      run: python -m py_compile src/app.py

  # ---------------------------------------------------------------
  # JOB 2: Deploy — runs on merge to main (requires approval)
  # ---------------------------------------------------------------
  deploy:
    name: 'Deploy to Azure Web App'
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: Production
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Package Application
      run: |
        cd src
        zip -r ../app.zip .

    - name: Deploy to Web App
      run: |
        # Find the Web App name dynamically (Terraform used a random ID suffix).
        # Match the demo app's prefix rather than taking [0] blindly, so this can't
        # silently deploy to some other app that happens to sort first.
        APP_NAME=$(az webapp list --resource-group rg-cloud-access-demo \
          --query "[?starts_with(name,'app-demo-')].name | [0]" -o tsv)
        if [ -z "$APP_NAME" ]; then
          echo "::error::No app-demo-* web app found in rg-cloud-access-demo. Run Day 0 first."
          exit 1
        fi
        echo "Deploying to Web App: $APP_NAME"

        # Deliberately NOT restarting first. Restarting doesn't warm the app -- it
        # cycles the container, and on a B1 plan Kudu shares that instance. Doing so
        # immediately before a zip deploy that runs an Oryx build (compiling pyodbc)
        # starved Kudu and returned HTTP 502 mid-build, leaving wwwroot empty.
        # Zip deploy restarts the app itself once it completes.
        az webapp deploy --resource-group rg-cloud-access-demo --name "$APP_NAME" \
          --src-path app.zip --type zip --timeout 900
