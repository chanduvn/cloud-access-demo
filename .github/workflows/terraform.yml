name: 'Enterprise Terraform CI/CD'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - safeguard-test

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  terraform-plan:
    name: 'Terraform Plan (PR Check)'
    runs-on: ubuntu-latest
    # This job runs on Pull Requests to show what *would* happen
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
    - name: Terraform Init
      run: terraform init
    - name: Terraform Plan
      run: terraform plan -no-color

  terraform-apply:
    name: 'Terraform Apply (Production)'
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'deploy')
    environment: Production
    steps:
    - uses: actions/checkout@v4

    # Azure Login must happen before Terraform so ARM credentials are available
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

    - uses: hashicorp/setup-terraform@v3
    - name: Terraform Init
      run: terraform init
    - name: Terraform Apply
      run: terraform apply -auto-approve

    # Zip the src folder and deploy it to the new Web App
    - name: Deploy Web App Code
      run: |
        cd src
        zip -r ../app.zip .
        cd ..
        # Find the name of the Web App dynamically (since we used a random ID)
        APP_NAME=$(az webapp list --resource-group rg-cloud-access-demo --query "[0].name" -o tsv)
        echo "Deploying to Web App: $APP_NAME"
        # Restart the app first to ensure it's warm before deploying
        az webapp restart --resource-group rg-cloud-access-demo --name $APP_NAME
        sleep 30
        az webapp deploy --resource-group rg-cloud-access-demo --name $APP_NAME --src-path app.zip --type zip --timeout 600

    # Decode base64-encoded certificate secrets into temp files for Safeguard auth.
    # For a lab appliance with a self-signed cert, leave SAFEGUARD_CA_PEM secret empty
    # and set SAFEGUARD_CA_FILE to 'insecure' in the env block below.
    - name: Write Safeguard Certificates
      run: |
        echo "${{ secrets.SAFEGUARD_CERT_PEM }}" | base64 -d > /tmp/sg-cert.pem
        echo "${{ secrets.SAFEGUARD_CERT_KEY }}" | base64 -d > /tmp/sg-key.pem
        # Set CA file path dynamically: use the cert if provided, otherwise use insecure mode
        if [ -n "${{ secrets.SAFEGUARD_CA_PEM }}" ]; then
          echo "${{ secrets.SAFEGUARD_CA_PEM }}" | base64 -d > /tmp/sg-ca.pem
          echo "SAFEGUARD_CA_FILE=/tmp/sg-ca.pem" >> $GITHUB_ENV
        else
          echo "SAFEGUARD_CA_FILE=insecure" >> $GITHUB_ENV
        fi
        chmod 600 /tmp/sg-cert.pem /tmp/sg-key.pem

    # Capture SQL Server FQDN and password directly from Terraform outputs —
    # no need to set SQL_SERVER_FQDN or DB_INITIAL_PASSWORD as GitHub secrets.
    - name: Register SQL Asset in Safeguard
      env:
        SAFEGUARD_HOST:      ${{ secrets.SAFEGUARD_HOST }}
        SAFEGUARD_CERT_FILE: /tmp/sg-cert.pem
        SAFEGUARD_KEY_FILE:  /tmp/sg-key.pem
        # SAFEGUARD_CA_FILE is set dynamically by the previous step
      run: |
        pip install -r scripts/requirements.txt --quiet
        # Read FQDN and password straight from Terraform state — no extra secrets needed
        export SQL_SERVER_FQDN=$(terraform output -raw sql_server_fqdn)
        export DB_USERNAME=$(terraform output -raw db_username)
        export DB_PASSWORD=$(terraform output -raw db_password)
        python scripts/register-safeguard-asset.py

    # Always clean up cert files so they are not left on the runner
    - name: Clean Up Cert Files
      if: always()
      run: rm -f /tmp/sg-cert.pem /tmp/sg-key.pem /tmp/sg-ca.pem

  # ---------------------------------------------------------
  # SAFEGUARD TEST JOB — manually triggered only
  # Use this to test Safeguard registration without running
  # the full Terraform pipeline. Trigger via:
  #   GitHub → Actions → Enterprise Terraform CI/CD → Run workflow
  # ---------------------------------------------------------
  safeguard-register-test:
    name: 'Safeguard Registration (Test Only)'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'safeguard-test'
    steps:
    - uses: actions/checkout@v4

    - name: Write Safeguard Certificates
      run: |
        echo "${{ secrets.SAFEGUARD_CERT_PEM }}" | base64 -d > /tmp/sg-cert.pem
        echo "${{ secrets.SAFEGUARD_CERT_KEY }}" | base64 -d > /tmp/sg-key.pem
        if [ -n "${{ secrets.SAFEGUARD_CA_PEM }}" ]; then
          echo "${{ secrets.SAFEGUARD_CA_PEM }}" | base64 -d > /tmp/sg-ca.pem
          echo "SAFEGUARD_CA_FILE=/tmp/sg-ca.pem" >> $GITHUB_ENV
        else
          echo "SAFEGUARD_CA_FILE=insecure" >> $GITHUB_ENV
        fi
        chmod 600 /tmp/sg-cert.pem /tmp/sg-key.pem

    # For the test job, SQL_SERVER_FQDN and DB_PASSWORD are passed as secrets
    # since Terraform state is not available here (no terraform apply was run).
    - name: Register SQL Asset in Safeguard
      env:
        SAFEGUARD_HOST:      ${{ secrets.SAFEGUARD_HOST }}
        SAFEGUARD_CERT_FILE: /tmp/sg-cert.pem
        SAFEGUARD_KEY_FILE:  /tmp/sg-key.pem
        # SAFEGUARD_CA_FILE is set dynamically by the previous step
        SQL_SERVER_FQDN:     ${{ secrets.SQL_SERVER_FQDN }}
        DB_USERNAME:         sqladmin
        DB_PASSWORD:         ${{ secrets.DB_INITIAL_PASSWORD }}
      run: |
        pip install -r scripts/requirements.txt --quiet
        python scripts/register-safeguard-asset.py

    - name: Clean Up Cert Files
      if: always()
      run: rm -f /tmp/sg-cert.pem /tmp/sg-key.pem /tmp/sg-ca.pem