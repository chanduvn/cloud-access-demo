name: 'Enterprise Terraform CI/CD'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  terraform-plan:
    name: 'Terraform Plan (PR Check)'
    runs-on: ubuntu-latest
    # This job runs on Pull Requests to show what *would* happen
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
    - name: Terraform Init
      run: terraform init
    - name: Terraform Plan
      run: terraform plan -no-color

  terraform-apply:
    name: 'Terraform Apply (Production)'
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: Production
    steps:
    - uses: actions/checkout@v4

    # Azure Login must happen before Terraform so ARM credentials are available
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

    - uses: hashicorp/setup-terraform@v3
    - name: Terraform Init
      run: terraform init
    - name: Terraform Apply
      run: terraform apply -auto-approve

    # Zip the src folder and deploy it to the new Web App
    - name: Deploy Web App Code
      run: |
        cd src
        zip -r ../app.zip .
        cd ..
        # Find the name of the Web App dynamically (since we used a random ID)
        APP_NAME=$(az webapp list --resource-group rg-cloud-access-demo --query "[0].name" -o tsv)
        echo "Deploying to Web App: $APP_NAME"
        # Restart the app first to ensure it's warm before deploying
        az webapp restart --resource-group rg-cloud-access-demo --name $APP_NAME
        sleep 30
        az webapp deploy --resource-group rg-cloud-access-demo --name $APP_NAME --src-path app.zip --type zip --timeout 600