name: 'Day 0 - Infrastructure'

# ---------------------------------------------------------------
# This pipeline provisions all Azure infrastructure using Terraform.
# It runs automatically when .tf files change, or can be triggered manually.
# ---------------------------------------------------------------

on:
  push:
    branches: [ "main" ]
    paths:
      - '*.tf'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '*.tf'
      - '.github/workflows/infra.yml'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

env:
  ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC:        true

jobs:
  # ---------------------------------------------------------------
  # JOB 1: Plan — runs on Pull Requests to preview changes
  # NOTE: the federated credential trusts subject "environment:Production" only
  # (matching the apply job below). This job has no `environment:`, so its OIDC
  # token won't match that trust and login will fail until a second federated
  # credential is added for the pull_request subject, or this job is also scoped
  # to an environment.
  # ---------------------------------------------------------------
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      run: terraform plan -no-color

  # ---------------------------------------------------------------
  # JOB 2: Apply — runs on merge to main (requires approval)
  # ---------------------------------------------------------------
  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: Production
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3

    # Terraform's own OIDC auth (ARM_USE_OIDC above) is internal to the azurerm
    # provider and doesn't log in the az CLI separately. The null_resource that
    # grants the app's managed identity SQL access shells out to `az` directly
    # (scripts/grant-sql-access.py), so it needs its own authenticated session.
    - name: Azure Login (for az CLI used by grant-sql-access.py)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # GitHub-hosted Ubuntu runners ship unixODBC but no SQL Server driver, so
    # pyodbc has nothing to connect through. Microsoft's package repo provides it.
    - name: Install SQL Server ODBC driver and pyodbc
      run: |
        curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(grep VERSION_ID /etc/os-release | cut -d '"' -f 2)/packages-microsoft-prod.deb"
        sudo dpkg -i packages-microsoft-prod.deb
        rm packages-microsoft-prod.deb
        sudo apt-get update -qq
        sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18
        pip install pyodbc

    # Fail fast and legibly. Without this, a missing ODBC driver or a broken az
    # session only surfaces from inside `terraform apply`, after half the
    # infrastructure is already provisioned, as an opaque provisioner error.
    - name: Preflight — verify grant-sql-access.py prerequisites
      run: |
        python -c "import pyodbc; \
          ds = [d for d in pyodbc.drivers() if 'SQL Server' in d]; \
          print('SQL Server ODBC drivers:', ds); \
          exit('FATAL: no SQL Server ODBC driver on this runner' if not ds else 0)"
        az account show --query "{subscription:name, identity:user.name}" -o json

    - name: Terraform Init
      run: terraform init

    - name: Terraform Apply
      run: terraform apply -auto-approve
